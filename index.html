<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container mt-5">
        <div class="card p-4 shadow">
            <h1 class="text-center"> Random Joke Generator</h1>
            <p class="text-center">Laugh a little, one joke at a time! </p>
            <div id="Joke"></div>
        </div>
    </div>

    <script>
        async function fetchjoke() {
            try {
                const responce = await fetch('https://official-joke-api.appspot.com/random_joke');
                const data = await responce.json();
                return data;
            }
            catch (err) {
                console.log(err);
            }
        }

        async function displayjoke() {
            const joke = await fetchjoke();
            const Joke = document.getElementById("Joke");

            const cardHtml = `<h3 class="mt-4">Setup</h3>
                             <p class="bg-warning-subtle rounded p-3 fs-4">${joke.setup}</p>
                             <h3>Punchline</h3>
                             <p class="bg-success-subtle rounded p-3 fs-4">${joke.punchline} </p>
                             <div class="text-center">
                             <button onclick="displayjoke()" class="btn btn-danger">Get Another Joke </button>
                             </div>`;
            Joke.innerHTML = cardHtml;
        }

        displayjoke();
    </script>
</body>
</html>
